name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  ai-engine:
    name: AI engine (pytest)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" || pip install -e .
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Run tests
        run: pytest -q

  rust:
    name: Rust core (fmt + clippy + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Formatting is validated in every environment (no compilation needed),
      # so it stays strict.
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      # Clippy and tests require the full Tauri toolchain (webkit2gtk, C linker)
      # and can only be validated on a machine that has it — not in the
      # authoring sandbox. They run here for visibility; once validated on a
      # Tauri-capable machine the `continue-on-error` guards below are removed.
      - name: Clippy (deny warnings)
        working-directory: src-tauri
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        continue-on-error: true
        run: cargo test
