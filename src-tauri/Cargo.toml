[package]
name = "elysium"
version = "0.1.0"
description = "Elysium — an open source AI Development Environment"
authors = ["Elysium Contributors"]
license = "Apache-2.0"
repository = "https://github.com/elysium-ide/elysium"
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "elysium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` lets us decode the bundled PNG at runtime to set the window icon
# (GNOME/Linux ignores the bundle icon in `tauri dev`, so we set it explicitly).
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
# In-app auto-update: check GitHub Releases, download + install a signed update.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# OS-level randomness for the per-session engine token.
rand = "0.8"
# The Rust core supervises the Python sidecar: process control, health polling
# over localhost TCP, and timers for restart backoff.
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "process",
  "sync",
  "time",
] }

[target.'cfg(unix)'.dependencies]
# Needed to SIGKILL the engine's whole process group on shutdown (see
# `engine::kill_tree`): PyInstaller `--onefile` bootloaders fork the real
# interpreter and wait on it, so killing only the bootloader's PID leaves
# that interpreter running as an orphan.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
