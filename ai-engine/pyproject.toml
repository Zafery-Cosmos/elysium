[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elysium-engine"
version = "0.6.2"
description = "Elysium AI Engine - FastAPI sidecar hosting the multi-agent team"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "keyring>=24.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
# Postgres + pgvector is the team/cloud backend (ADR-001); optional on desktop.
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
include = ["elysium_engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
